packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
minimumReleaseAgeExclude:
  - capjs-core@0.1.15
overrides:
  body-parser: 2.4.0
  fast-uri: 3.1.9
  follow-redirects: 1.16.3
  js-yaml: 4.3.2
  lodash: 4.18.1
  multer: 2.5.0
  uuid: 11.1.1
