<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5c1219" />
    <meta name="color-scheme" content="light" />
    <!--
      Apply the saved theme before first paint. Light is the default;
      dark is only enabled by an explicit saved preference.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('coe-nnect:theme');
          var dark = stored === 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
          var scheme = document.querySelector('meta[name="color-scheme"]');
          if (scheme) scheme.setAttribute('content', dark ? 'dark' : 'light');
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor)
            themeColor.setAttribute('content', dark ? '#0f172a' : '#5c1219');
        } catch (e) {
          /* Ignore unavailable storage; fall back to light. */
        }
      })();
    </script>
    <!--
      Apply the saved accent/background before first paint. The CSS text
      is generated by src/store/appearance.store.ts and cached here so
      there is no flash of the default maroon.
    -->
    <script>
      (function () {
        try {
          var css = localStorage.getItem('coe-nnect:appearance-css');
          if (!css) return;
          var style = document.createElement('style');
          style.id = 'coe-appearance';
          style.textContent = css;
          (document.head || document.documentElement).appendChild(style);
        } catch (e) {
          /* Ignore unavailable storage. */
        }
      })();
    </script>
    <!--
      Enable the experimental glass theme before first paint. The flag is
      stored alongside the accent in coe-nnect:appearance; the rules live
      in src/styles/globals.css under html.glass.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('coe-nnect:appearance');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          if (parsed && parsed.glass === true) {
            document.documentElement.classList.add('glass');
          }
        } catch (e) {
          /* Ignore unavailable storage or malformed JSON. */
        }
      })();
    </script>
    <meta
      name="description"
      content="CoE-NNECT: College of Engineering Scheduling System — Western Mindanao State University"
    />

    <!-- iOS PWA / standalone hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CoE-NNECT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Material Symbols: display=block hides the icon glyphs until the font
      is loaded, preventing the "dashboard" / "menu" text flash on slow
      mobile connections.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block"
      rel="stylesheet"
    />
    <title>CoE-NNECT — WMSU Scheduling System</title>
  </head>
  <body class="bg-background text-on-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
