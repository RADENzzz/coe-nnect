<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5c1219" />
    <meta name="color-scheme" content="light" />
    <!--
      Self-hosted Cap solver assets. Must run before cap-widget is imported.
      See public/cap-config.js.
    -->
    <script src="/cap-config.js"></script>
    <!--
      Apply the saved theme, accent palette, and glass flag before first
      paint. External (not inline) so the production CSP can forbid inline
      scripts. Also exposes the per-request CSP nonce to cap-widget.
      See public/theme-boot.js.
    -->
    <script src="/theme-boot.js"></script>
    <meta
      name="description"
      content="CoE-NNECT: College of Engineering Scheduling System — Western Mindanao State University"
    />

    <!-- iOS PWA / standalone hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CoE-NNECT" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/cet-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Material Symbols: display=block hides the icon glyphs until the font
      is loaded, preventing the "dashboard" / "menu" text flash on slow
      mobile connections.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&display=block"
      rel="stylesheet"
    />
    <title>CoE-NNECT</title>
  </head>
  <body class="bg-background text-on-background font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
