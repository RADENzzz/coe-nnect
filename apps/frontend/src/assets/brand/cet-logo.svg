<svg id="cet-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" role="img" aria-labelledby="cet-logo-title cet-logo-desc">
  <title id="cet-logo-title">WMSU College of Engineering and Technology logo</title>
  <desc id="cet-logo-desc">Circular College of Engineering and Technology badge with a yellow octagon and red angular arrows.</desc>
  <defs>
    <path id="cet-arc-top" d="M102.3 356.8 A360 360 0 0 1 797.7 356.8"/>
    <path id="cet-arc-bottom" d="M143.6 707.1 A400 400 0 0 0 756.4 707.1"/>
  </defs>
  <g id="cet-badge" class="cet-badge">
    <g id="cet-outer-ring" class="cet-outer-ring">
      <circle cx="450" cy="450" r="438" fill="none" stroke="#111111" stroke-width="8"/>
    </g>
    <g id="cet-inner-ring" class="cet-inner-ring">
      <circle cx="450" cy="450" r="338" fill="none" stroke="#111111" stroke-width="6"/>
    </g>
    <g id="cet-ring-text" fill="#da0000" font-family="Arial Narrow, Arial, Helvetica, sans-serif" font-weight="700">
      <text id="cet-text-top" font-size="46" letter-spacing="0.5">
        <textPath href="#cet-arc-top" startOffset="50%" text-anchor="middle" textLength="920" lengthAdjust="spacingAndGlyphs">“COLLEGE OF ENGINEERING AND TECHNOLOGY”</textPath>
      </text>
      <text id="cet-text-bottom" font-size="48" letter-spacing="0.5">
        <textPath href="#cet-arc-bottom" startOffset="50%" text-anchor="middle" textLength="480" lengthAdjust="spacing">“ WMSU ” 1974</textPath>
      </text>
    </g>
    <g id="cet-octagon" class="cet-octagon">
      <path d="M323.7 145.1 L576.3 145.1 L754.9 323.7 L754.9 576.3 L576.3 754.9 L323.7 754.9 L145.1 576.3 L145.1 323.7 Z" fill="#ffff00" stroke="#111111" stroke-width="14" stroke-linejoin="miter"/>
    </g>
    <g id="cet-inner-arrows" fill="#cccccc" stroke="#111111" stroke-width="5" stroke-linejoin="round">
      <path d="M446 274 L470 274 L470 380 L597 448 L470 448 L470 380 L446 380 Z"/>
      <path d="M300 452 L400 452 L356 512 Z"/>
      <path d="M445 517 L445 602 L405 562 Z"/>
    </g>
    <g id="cet-red-arrows" stroke-linejoin="round">
      <path d="M332 268 L422 268 L422 353 L401 336 L284 452 L284 456 L358 528 L416 467 L402 450 L463 449 L467 507 L450 497 L391 561 L449 622 L619 454 L504 339 L483 353 L484 268 L572 268 L551 293 L712 453 L450 715 L191 454 L351 294 L352 288 Z" fill="#da0000" stroke="#ffffff" stroke-width="9"/>
      <path d="M332 268 L422 268 L422 353 L401 336 L284 452 L284 456 L358 528 L416 467 L402 450 L463 449 L467 507 L450 497 L391 561 L449 622 L619 454 L504 339 L483 353 L484 268 L572 268 L551 293 L712 453 L450 715 L191 454 L351 294 L352 288 Z" fill="#da0000" stroke="#111111" stroke-width="4"/>
    </g>
  </g>
</svg>
