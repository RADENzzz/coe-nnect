<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">CoE-NNECT database schema overview</title>
  <desc id="desc">Domain map of the 34-table CoE-NNECT PostgreSQL schema, grouped into identity, academic catalog, prospectus import, faculty constraints, scheduling, platform status, and collaboration domains.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <style>
      .title { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: "Segoe UI", Arial, sans-serif; fill: #475569; }
      .panel-title { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; font-size: 18px; }
      .panel-meta { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .table-name { font-family: "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 13.5px; fill: #1e293b; }
      .arrow-label { font-family: "Segoe UI", Arial, sans-serif; font-size: 11px; fill: #64748b; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; stroke-linejoin: round; }
      .stat-number { font-family: "Segoe UI", Arial, sans-serif; font-weight: 700; font-size: 24px; fill: #0f172a; }
      .stat-label { font-family: "Segoe UI", Arial, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.08em; fill: #64748b; text-transform: uppercase; }
      .note { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #475569; }
      .footer { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <rect x="64" y="44" width="8" height="52" rx="4" fill="#0f766e"/>
  <text x="88" y="72" class="title" font-size="30">CoE-NNECT database schema</text>
  <text x="88" y="100" class="subtitle" font-size="14">Public PostgreSQL schema · domain overview</text>
  <text x="1536" y="72" text-anchor="end" class="panel-meta" font-size="13">PostgreSQL 17.11 · Supabase</text>
  <text x="1536" y="94" text-anchor="end" class="panel-meta" font-size="12">Snapshot: 22 October 2026</text>

  <!-- Identity -->
  <g filter="url(#soft-shadow)">
    <rect x="64" y="140" width="430" height="260" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>
  <circle cx="88" cy="166" r="4" fill="#3b82f6"/>
  <text x="100" y="172" class="panel-title" fill="#1d4ed8">Identity and organization</text>
  <text x="470" y="170" text-anchor="end" class="panel-meta">4 tables</text>
  <g>
    <circle cx="92" cy="220" r="3" fill="#3b82f6"/><text x="104" y="224" class="table-name">users</text>
    <circle cx="300" cy="220" r="3" fill="#3b82f6"/><text x="312" y="224" class="table-name">department</text>
    <circle cx="92" cy="248" r="3" fill="#3b82f6"/><text x="104" y="252" class="table-name">faculty</text>
    <circle cx="300" cy="248" r="3" fill="#3b82f6"/><text x="312" y="252" class="table-name">designation</text>
  </g>
  <text x="88" y="330" class="note">Auth profiles, departments, faculty,</text>
  <text x="88" y="350" class="note">and faculty designations.</text>

  <!-- Catalog -->
  <g filter="url(#soft-shadow)">
    <rect x="534" y="140" width="440" height="290" rx="16" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  </g>
  <circle cx="558" cy="166" r="4" fill="#22c55e"/>
  <text x="570" y="172" class="panel-title" fill="#15803d">Academic catalog</text>
  <text x="950" y="170" text-anchor="end" class="panel-meta">5 tables</text>
  <g>
    <circle cx="562" cy="220" r="3" fill="#22c55e"/><text x="574" y="224" class="table-name">program</text>
    <circle cx="770" cy="220" r="3" fill="#22c55e"/><text x="782" y="224" class="table-name">subject</text>
    <circle cx="562" cy="248" r="3" fill="#22c55e"/><text x="574" y="252" class="table-name">prospectus</text>
    <circle cx="770" cy="248" r="3" fill="#22c55e"/><text x="782" y="252" class="table-name">section</text>
    <circle cx="562" cy="276" r="3" fill="#22c55e"/><text x="574" y="280" class="table-name">term</text>
  </g>
  <text x="558" y="340" class="note">Departments own programs and subjects;</text>
  <text x="558" y="360" class="note">prospectuses map subjects to programs.</text>
  <text x="558" y="380" class="note">Sections and terms provide the scheduling axes.</text>

  <!-- Prospectus import -->
  <g filter="url(#soft-shadow)">
    <rect x="1014" y="140" width="522" height="170" rx="16" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  </g>
  <circle cx="1038" cy="166" r="4" fill="#f59e0b"/>
  <text x="1050" y="172" class="panel-title" fill="#b45309">Prospectus import</text>
  <text x="1512" y="170" text-anchor="end" class="panel-meta">2 tables</text>
  <g>
    <circle cx="1042" cy="220" r="3" fill="#f59e0b"/><text x="1054" y="224" class="table-name">prospectus_pdf</text>
    <circle cx="1292" cy="220" r="3" fill="#f59e0b"/><text x="1304" y="224" class="table-name">prospectus_pdf_table</text>
    <circle cx="1042" cy="248" r="3" fill="#f59e0b"/><text x="1054" y="252" class="table-name">storage_path + table regions</text>
  </g>
  <text x="1038" y="284" class="note">PDF metadata, storage pointers, and parsed table regions.</text>

  <!-- Platform status -->
  <g filter="url(#soft-shadow)">
    <rect x="1014" y="330" width="522" height="110" rx="16" fill="#fdf2f8" stroke="#fbcfe8" stroke-width="1.5"/>
  </g>
  <circle cx="1038" cy="356" r="4" fill="#db2777"/>
  <text x="1050" y="362" class="panel-title" fill="#be185d">Platform status</text>
  <text x="1512" y="360" text-anchor="end" class="panel-meta">1 table</text>
  <g>
    <circle cx="1042" cy="400" r="3" fill="#db2777"/><text x="1054" y="404" class="table-name">system_status</text>
  </g>
  <text x="1038" y="424" class="note">Singleton banner row for outage and maintenance notices.</text>

  <!-- Faculty constraints -->
  <g filter="url(#soft-shadow)">
    <rect x="64" y="450" width="620" height="260" rx="16" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  </g>
  <circle cx="88" cy="476" r="4" fill="#a855f7"/>
  <text x="100" y="482" class="panel-title" fill="#7e22ce">Faculty constraints and requests</text>
  <text x="660" y="480" text-anchor="end" class="panel-meta">7 tables</text>
  <g>
    <circle cx="92" cy="530" r="3" fill="#a855f7"/><text x="104" y="534" class="table-name">faculty_preference</text>
    <circle cx="394" cy="530" r="3" fill="#a855f7"/><text x="406" y="534" class="table-name">faculty_unavailability</text>
    <circle cx="92" cy="558" r="3" fill="#a855f7"/><text x="104" y="562" class="table-name">faculty_commitment</text>
    <circle cx="394" cy="558" r="3" fill="#a855f7"/><text x="406" y="562" class="table-name">faculty_qualification</text>
    <circle cx="92" cy="586" r="3" fill="#a855f7"/><text x="104" y="590" class="table-name">subject_restriction</text>
    <circle cx="394" cy="586" r="3" fill="#a855f7"/><text x="406" y="590" class="table-name">faculty_request</text>
    <circle cx="92" cy="614" r="3" fill="#a855f7"/><text x="104" y="618" class="table-name">cross_department_request</text>
  </g>
  <text x="88" y="662" class="note">Preferences, fixed commitments, qualifications,</text>
  <text x="88" y="682" class="note">unavailability, and cross-department approvals.</text>

  <!-- Scheduling -->
  <g filter="url(#soft-shadow)">
    <rect x="724" y="460" width="812" height="300" rx="16" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
  </g>
  <circle cx="748" cy="486" r="4" fill="#06b6d4"/>
  <text x="760" y="492" class="panel-title" fill="#0e7490">Scheduling and rooms</text>
  <text x="1512" y="490" text-anchor="end" class="panel-meta">9 tables</text>
  <g>
    <circle cx="752" cy="540" r="3" fill="#06b6d4"/><text x="764" y="544" class="table-name">schedule</text>
    <circle cx="1016" cy="540" r="3" fill="#06b6d4"/><text x="1028" y="544" class="table-name">schedule_unscheduled</text>
    <circle cx="1280" cy="540" r="3" fill="#06b6d4"/><text x="1292" y="544" class="table-name">schedule_version</text>
    <circle cx="752" cy="568" r="3" fill="#06b6d4"/><text x="764" y="572" class="table-name">time_slot</text>
    <circle cx="1016" cy="568" r="3" fill="#06b6d4"/><text x="1028" y="572" class="table-name">scheduling_setting</text>
    <circle cx="1280" cy="568" r="3" fill="#06b6d4"/><text x="1292" y="572" class="table-name">auto_generate_lock</text>
    <circle cx="752" cy="596" r="3" fill="#06b6d4"/><text x="764" y="600" class="table-name">room</text>
    <circle cx="1016" cy="596" r="3" fill="#06b6d4"/><text x="1028" y="600" class="table-name">room_preference</text>
    <circle cx="1280" cy="596" r="3" fill="#06b6d4"/><text x="1292" y="600" class="table-name">minor_subject_schedule</text>
  </g>
  <text x="748" y="648" class="note">Timetable rows, generated versions, unplaced sessions,</text>
  <text x="748" y="668" class="note">room inventory/preferences, and generator locking.</text>
  <text x="748" y="700" class="note">Schedule status flow: draft → review → finalized → published</text>

  <!-- Collaboration -->
  <g filter="url(#soft-shadow)">
    <rect x="724" y="800" width="812" height="160" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <circle cx="748" cy="826" r="4" fill="#64748b"/>
  <text x="760" y="832" class="panel-title" fill="#334155">Collaboration, notifications, and audit</text>
  <text x="1512" y="830" text-anchor="end" class="panel-meta">6 tables</text>
  <g>
    <circle cx="752" cy="878" r="3" fill="#64748b"/><text x="764" y="882" class="table-name">conversation</text>
    <circle cx="1016" cy="878" r="3" fill="#64748b"/><text x="1028" y="882" class="table-name">conversation_member</text>
    <circle cx="1280" cy="878" r="3" fill="#64748b"/><text x="1292" y="882" class="table-name">message</text>
    <circle cx="752" cy="906" r="3" fill="#64748b"/><text x="764" y="910" class="table-name">notification</text>
    <circle cx="1016" cy="906" r="3" fill="#64748b"/><text x="1028" y="910" class="table-name">user_notification_setting</text>
    <circle cx="1280" cy="906" r="3" fill="#64748b"/><text x="1292" y="910" class="table-name">audit_trail</text>
  </g>

  <!-- Facts -->
  <rect x="64" y="750" width="620" height="210" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="88" cy="776" r="4" fill="#0f766e"/>
  <text x="100" y="782" class="panel-title" fill="#0f172a">Schema at a glance</text>
  <text x="660" y="780" text-anchor="end" class="panel-meta">public schema</text>

  <g>
    <rect x="88" y="812" width="130" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="153" y="840" text-anchor="middle" class="stat-number">34</text>
    <text x="153" y="856" text-anchor="middle" class="stat-label">tables</text>

    <rect x="230" y="812" width="130" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="295" y="840" text-anchor="middle" class="stat-number">70</text>
    <text x="295" y="856" text-anchor="middle" class="stat-label">foreign keys</text>

    <rect x="372" y="812" width="130" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="437" y="840" text-anchor="middle" class="stat-number">9</text>
    <text x="437" y="856" text-anchor="middle" class="stat-label">enum types</text>

    <rect x="514" y="812" width="130" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="579" y="840" text-anchor="middle" class="stat-number">51</text>
    <text x="579" y="856" text-anchor="middle" class="stat-label">RLS policies</text>
  </g>

  <text x="88" y="900" class="note">RLS is enabled on all 34 tables.</text>
  <text x="88" y="922" class="note">Column-level ERDs: README.md in this folder.</text>

  <!-- Arrows -->
  <path d="M 494 260 L 534 260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="514" y="250" text-anchor="middle" class="arrow-label">scopes</text>

  <path d="M 974 250 L 1014 250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="994" y="240" text-anchor="middle" class="arrow-label">PDF</text>

  <path d="M 279 400 L 279 450" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="289" y="428" class="arrow-label">employs</text>

  <path d="M 754 430 L 754 460" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="764" y="449" class="arrow-label">defines</text>

  <path d="M 684 580 L 724 580" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="704" y="568" text-anchor="middle" class="arrow-label">constraints</text>

  <path d="M 1130 760 L 1130 800" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1142" y="784" class="arrow-label">activity</text>

  <text x="1536" y="986" text-anchor="end" class="footer">Source: coe-nnect-database-structure.sql · generated 22 Oct 2026</text>
</svg>
