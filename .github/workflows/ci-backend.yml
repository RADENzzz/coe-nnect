name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and type-check backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend
        run: pnpm --filter @coe-nnect/backend build

      - name: Type-check backend
        run: pnpm --filter @coe-nnect/backend typecheck

      - name: Type-check backend tests
        run: pnpm --filter @coe-nnect/backend typecheck:test

      - name: Run backend unit tests
        run: pnpm --filter @coe-nnect/backend test:ci

      - name: Run backend integration tests
        run: pnpm --filter @coe-nnect/backend test:e2e

      - name: Test scheduling rules
        run: pnpm --filter @coe-nnect/constraint-rules test
