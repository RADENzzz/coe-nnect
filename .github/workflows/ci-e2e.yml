name: Browser E2E

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Start local Supabase
        run: supabase start

      - name: Reset database from tracked migrations
        run: supabase db reset --local --yes

      - name: Export local Supabase credentials
        run: |
          eval "$(supabase status -o env)"

          ANON="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          SERVICE="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          if [ -z "$API_URL" ] || [ -z "$DB_URL" ] || [ -z "$ANON" ] || [ -z "$SERVICE" ]; then
            echo "Could not read local Supabase credentials from status output." >&2
            exit 1
          fi

          {
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_ANON_KEY=$ANON"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE"
            echo "E2E_DATABASE_URL=$DB_URL"
            echo "E2E_DATABASE_SSL=false"
          } >> "$GITHUB_ENV"

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Type-check E2E tests
        run: pnpm typecheck:e2e

      - name: Run Playwright workflow
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
